<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Materiais — Edmilson Miranda Jr.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter', sans-serif;
      background:#f8f8f6;
      color:#111;
      padding:80px 8vw;
      line-height:1.5;
    }

    .container{
      max-width:820px;
      margin:auto;
    }

    header{
      margin-bottom:80px;
    }

    header h1{
      font-size:clamp(2.5rem,6vw,5rem);
      font-weight:500;
      letter-spacing:-3px;
      line-height:0.95;
      margin-bottom:20px;
    }

    header p{
      max-width:520px;
      color:#666;
      font-size:1rem;
    }

    .file-list{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .file{
      display:flex;
      justify-content:space-between;
      align-items:center;

      padding:22px 0;

      border-bottom:1px solid rgba(0,0,0,0.08);
    }

    .file-info h2{
      font-size:1.1rem;
      font-weight:500;
      margin-bottom:6px;
    }

    .file-info p{
      color:#777;
      font-size:0.95rem;
    }

    .download{
      text-decoration:none;
      color:#111;
      font-size:0.95rem;
      font-weight:500;
      transition:opacity 0.2s ease;
    }

    .download:hover{
      opacity:0.5;
    }

    footer{
      margin-top:120px;
      color:#888;
      font-size:0.85rem;
    }

    @media(max-width:700px){

      .file{
        flex-direction:column;
        align-items:flex-start;
        gap:18px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <header>

      <h1>
        Materiais
      </h1>

      <p>
        Arquivos, apresentações e documentos de aula.
      </p>

    </header>

    <section class="file-list">

      <article class="file">

        <div class="file-info">

          <h2>
            Modelo Pitch TCC UNI7
          </h2>

          <p>
            PowerPoint para apresentações rápidas de pesquisa.
          </p>

        </div>

        <a class="download"
           href="Modelo_Pitch_TCC_UNI7.pptx">

          Download

        </a>

      </article>

    </section>

    <footer>
      Edmilson Miranda Jr.
    </footer>

  </div>

</body>
</html>
