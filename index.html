<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Materiais — Edmilson Miranda Jr.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'DM Sans', sans-serif;
      background:#f8f8f6;
      color:#111;
      padding:80px 8vw;
      line-height:1.5;
    }

    .container{
      max-width:820px;
      margin:auto;
    }

    header{
      margin-bottom:80px;
    }

    header h1{
  font-family:'DM Serif Display', serif;

  font-size:clamp(2.2rem,5vw,4rem);

  font-weight:400;

  letter-spacing:-1.5px;

  line-height:0.98;

  margin-bottom:18px;
}

   header p{
  max-width:520px;

  color:#666;

  font-size:0.95rem;

  line-height:1.7;
}

    .file-list{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .file{
      display:flex;
      justify-content:space-between;
      align-items:center;

      padding:22px 0;

      border-bottom:1px solid rgba(0,0,0,0.08);
    }

   .file-info h2{

  font-family:'DM Serif Display', serif;

  font-size:1.15rem;

  font-weight:400;

  margin-bottom:8px;

  letter-spacing:-0.5px;
}

    .file-info p{

  color:#777;

  font-size:0.92rem;

  line-height:1.65;
}

   .download{

  text-decoration:none;

  color:#111;

  font-size:0.9rem;

  font-weight:500;

  opacity:0.72;

  transition:opacity 0.2s ease;
}

    .download:hover{
      opacity:0.5;
    }

    footer{
      margin-top:120px;
      color:#888;
      font-size:0.85rem;
    }

    @media(max-width:700px){

      .file{
        flex-direction:column;
        align-items:flex-start;
        gap:18px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <header>

      <h1>
        Materiais
      </h1>

      <p>
        Arquivos, apresentações e documentos de aula.
      </p>

    </header>

    <section class="file-list">

      <article class="file">

        <div class="file-info">

          <h2>
            Modelo Pitch TCC UNI7
          </h2>

          <p>
            PowerPoint para apresentações rápidas de pesquisa.
          </p>

        </div>

        <a class="download"
           href="Modelo_Pitch_TCC_UNI7.pptx">

          Download

        </a>

      </article>

    </section>

    <footer>
      Edmilson Miranda Jr.
    </footer>

  </div>

</body>
</html>
